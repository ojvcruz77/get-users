<!doctype html>

<html lang="pt-br">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Recuperar</title>
    </head>
    <body>
        <main>
            <form>
                <h1>Recuperar Senha</h1>
                <label>E-mail *</label>
                <input type="email" />
                <label>Nova Senha *</label>
                <input type="password" id="new_password" />
                <label>Confirmar nova Senha *</label>
                <input type="password" id="confirm_new_password" />
                <input type="checkbox" />
                <label>Mostrar Senha</label>
                <button>Recuperar</button>
                <p>Esqueceu a senha? Recupere-a <a href="./login.html">aqui</a>.</p>
                <p>Não possui cadastro? Registre-se <a href="./register.html">aqui</a>.</p>
            </form>
        </main>
        <script src="../scripts/recovery.js"></script>
    </body>
</html>
